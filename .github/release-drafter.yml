name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '🧰 Maintenance'
    labels:
      - 'chore'
      - 'dependencies'
      - 'maintenance'
      - 'documentation'
  - title: '🐳 Docker'
    labels:
      - 'docker'
      - 'container'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.
version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking-change'
  minor:
    labels:
      - 'minor'
      - 'feature'
  patch:
    labels:
      - 'patch'
      - 'bug'
      - 'enhancement'
      - 'documentation'
  default: patch
template: |
  ## Changes

  $CHANGES

  ## Docker Images

  - `ditdotdev/REPOSITORY_NAME:$RESOLVED_VERSION`
  - `ditdotdev/REPOSITORY_NAME:latest`